<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<!-- 防閃爍：渲染前讀 localStorage 設主題 -->
<script>
(function(){try{var t=localStorage.getItem('t');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Losing on Hood · Meme 交易面板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{border-radius:0 !important}
:root{
--bg:#09090b;--card:#111113;--card2:#18181b;--line:rgba(255,255,255,.08);
--ink:#fafafa;--dim:#a1a1aa;--muted:#52525b;
--green:#22c55e;--red:#ef4444;--blue:#6366f1;--amber:#f59e0b;--cyan:#06b6d4;
--sc:#6366f1;--na:#f59e0b;--ri:#ef4444;--sn:#22c55e;--ju:#a78bfa;
}
[data-theme=light]{--bg:#fafafa;--card:#fff;--card2:#f4f4f5;--line:rgba(0,0,0,.08);--ink:#18181b;--dim:#71717a;--muted:#a1a1aa;--green:#16a34a;--red:#dc2626;--blue:#4f46e5;--amber:#d97706;--cyan:#0891b2;--sc:#4f46e5;--na:#d97706;--ri:#dc2626;--sn:#16a34a;--ju:#8b5cf6}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,sans-serif}
.wrap{height:100vh;display:flex;flex-direction:column}
/* Header */
.hd{flex:0 0 auto;padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.t{font:700 18px/1.2 Inter;letter-spacing:-.01em}
.sub{font:500 10px/1 'JetBrains Mono';color:var(--dim);margin-top:2px}
.hd-r{display:flex;align-items:center;gap:8px}
/* 呼吸連線點 + LIVE 標籤 */
.pulse-dot{width:8px;height:8px;background:var(--green);display:inline-block;animation:pulse 2s infinite}
.pulse-dot.offline{background:var(--red);animation:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
.livetag{font:600 9px/1 'JetBrains Mono';text-transform:uppercase;letter-spacing:.05em;color:var(--green)}
.livetag.offline{color:var(--red)}
.tab{padding:6px 12px;font:600 10px/1 Inter;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border:1px solid transparent;cursor:pointer}
.tab.on{color:var(--ink);border-color:var(--line);background:var(--card2)}
.th{width:28px;height:28px;border:1px solid var(--line);color:var(--dim);font-size:14px;cursor:pointer;background:none}
/* 雙欄工作台 Grid */
.wb{flex:1 1 0;display:grid;overflow:hidden}
.wb .col-left{grid-column:1}
.wb .col-right{grid-column:2}
@media(max-width:959px){.wb{grid-template-columns:1fr}}
@media(min-width:960px){.wb{grid-template-columns:3fr 2fr}}

/* 手機順序重排：KPI 放最上面，會議中間，交易下 */
@media(max-width:959px){
  .col-right .col-kpi{order:1}
  .col-left{order:2}
  .col-right .col-trades{order:3}
  .col-left,.col-right{border-left:none!important;border-top:1px solid var(--line)}
}

/* 右欄分區容器 */
.col-right{display:flex;flex-direction:column}
.col-kpi{flex:0 0 auto}
.col-trades{flex:1 1 0;overflow-y:auto;-webkit-overflow-scrolling:touch}

.col{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.col-t{position:sticky;top:0;z-index:2;background:var(--bg);font:600 10px/1 Inter;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 16px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}

/* KPI 3x2 矩陣 */
.kpi-g{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);margin:12px 14px;border:1px solid var(--line)}
@media(min-width:960px){.kpi-g{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--card);padding:10px 12px;text-align:left}
.kpi .l{font:500 9px/1 Inter;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.kpi .v{font:600 16px/1 'JetBrains Mono';font-feature-settings:"tnum";text-align:right}
.g{color:var(--green)}.r{color:var(--red)}

/* Linear 狀態標籤（零圓角） */
.pill{display:inline-flex;align-items:center;gap:5px;font:600 9px/1 Inter;letter-spacing:.03em;padding:3px 8px;flex-shrink:0}
.pill::before{content:'';width:6px;height:6px;background:currentColor}
.pill.ok{color:var(--green);background:rgba(34,197,94,.08)}
.pill.no{color:var(--red);background:rgba(239,68,68,.08)}
.pill.partial{color:var(--amber);background:rgba(245,158,11,.08);font-size:8px}

/* 會議卡 */
.dcard{background:var(--card);border:1px solid var(--line);margin:6px 14px;overflow:hidden;transition:border-color .15s,background .15s}
.dcard:hover{border-color:rgba(255,255,255,.16);background:var(--card2)}
[data-theme=light] .dcard:hover{border-color:rgba(0,0,0,.18)}
.dcard-h{display:flex;align-items:center;padding:9px 12px;cursor:pointer;gap:8px}
.dcard-sym{font:600 13px/1 'JetBrains Mono';flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard-sc{font:700 14px/1 'JetBrains Mono';min-width:22px;text-align:right;font-feature-settings:"tnum"}
.dcard-ts{font:400 10px/1 'JetBrains Mono';color:var(--muted);flex-shrink:0}
.dcard-arr{font:10px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.dcard.open .dcard-arr{transform:rotate(90deg)}
.dcard-b{display:none}
.dcard.open .dcard-b{display:block}

/* 5-Agent 決策快照矩陣 */
.dcard-b .snap-title{font:600 10px/1 Inter;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px;letter-spacing:.04em;border-top:1px solid var(--line)}
.aline{display:grid;grid-template-columns:44px 18px 42px 1fr;gap:4px;padding:7px 12px;border-top:1px solid var(--line);align-items:center;font-size:11px}
.aline:first-child{border-top:none}
.a-nm{font:600 9px/1 Inter;text-transform:uppercase;letter-spacing:.02em}
.a-nm.sc{color:var(--sc)}.a-nm.na{color:var(--na)}.a-nm.ri{color:var(--ri)}.a-nm.sn{color:var(--sn)}.a-nm.ju{color:var(--ju)}
.a-sc{font:600 11px/1 'JetBrains Mono';text-align:right;font-feature-settings:"tnum"}
.a-bd{font:600 8px/1 Inter;text-align:center;padding:1px 5px;border:1px solid;text-transform:uppercase}
.a-bd.ok{color:var(--green);border-color:var(--green)}.a-bd.no{color:var(--red);border-color:var(--red)}
.a-rs{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-rs.tmpl{opacity:.35;color:var(--muted)}
.a-rs.tmpl::after{content:'（模板）';font-size:9px;color:var(--muted)}

/* 交易列 */
.trow{display:grid;grid-template-columns:1fr 56px 58px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.trow:hover{background:var(--card)}
.trow-s{font:600 12px/1 'JetBrains Mono'}
.trow-sub{font:400 10px/1 Inter;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.trow-pct{font:600 13px/1 'JetBrains Mono';text-align:right;font-feature-settings:"tnum"}
.trow-pnl{font:500 11px/1 'JetBrains Mono';text-align:right;color:var(--dim);font-feature-settings:"tnum"}
.trow-d{display:none;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);font-size:11px}
.trow.open+.trow-d{display:block}
.trow-d .kv{display:flex;justify-content:space-between;padding:3px 0}
.trow-d .kv .k{color:var(--muted)}.trow-d .kv .v{font:500 11px/1 'JetBrains Mono';text-align:right;max-width:200px;overflow:hidden;text-overflow:ellipsis;font-feature-settings:"tnum"}

/* PEAK 高亮標籤 */
.peak-tag{display:inline-block;font:600 9px/1 'JetBrains Mono';color:var(--green);border:1px solid var(--green);background:rgba(34,197,94,.06);padding:2px 6px;margin-left:6px;vertical-align:middle;font-feature-settings:"tnum"}
/* 決策快照矩陣容器 */
.snap-matrix{display:grid;gap:1px;border:1px solid var(--line);margin:8px 12px;background:var(--card)}
.snap-matrix .aline{background:var(--card)}

/* 警告/無留痕 */
.warn{display:inline-flex;align-items:center;gap:4px;font:500 9px/1 Inter;color:var(--muted);background:var(--card2);border:1px dashed var(--line);padding:2px 8px;opacity:.7}
/* 模板降級（理由區） */
.reason-tmpl{opacity:.35;color:var(--muted)}
.reason-tmpl::after{content:' · 預設模板';font-size:9px;color:var(--muted)}

/* 斷點 */
@media(min-width:960px){
  .kpi .v{font-size:18px}
  .trow{grid-template-columns:1fr 80px 80px 90px}
  .trow-pnl{display:block}
  .aline{grid-template-columns:110px 60px 90px 1fr;font-size:12px}
}
@media(max-width:600px){
  .kpi-g{grid-template-columns:repeat(2,1fr);margin:8px 10px}
  .dcard{margin:6px 10px}
  .trow{padding:9px 10px}
  .aline{grid-template-columns:38px 18px 38px 1fr;font-size:10px}
  .trow-sub{max-width:140px}
  .aline .a-rs{white-space:normal;overflow:visible;text-overflow:clip}
}
</style>
</head>
<body>
<div class="wrap">
<div class="hd">
  <div>
    <div class="t">Losing on Hood</div>
    <div class="sub">gmgn × robinhood chain · 五代理決策流水線</div>
  </div>
  <div class="hd-r">
    <span class="pulse-dot" id="live-dot"></span>
    <span class="livetag" id="live-tag">LIVE</span>
    <div class="tab on" data-p="paper" onclick="showTab('paper')">模擬倉</div>
    <div class="tab" data-p="live" onclick="showTab('live')">實盤</div>
    <button class="th" onclick="var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('t',n)">◐</button>
  </div>
</div>
<div class="wb" id="paper-view">
  <div class="col col-left">
    <div class="col-t">AI 會議紀錄</div>
    <div id="pdisc"></div>
  </div>
  <div class="col col-right">
    <div class="col-kpi">
      <div class="col-t">KPI 總覽</div>
      <div class="kpi-g" id="pkpi"></div>
    </div>
    <div class="col-trades">
      <div class="col-t">交易紀錄</div>
      <div id="ptrades"></div>
    </div>
  </div>
</div>
<div class="wb" id="live-view" style="display:none">
  <div class="col col-left">
    <div class="col-t">實盤概況</div>
    <div class="kpi-g" id="lkpi"></div>
  </div>
  <div class="col col-right col-trades">
    <div class="col-t">平倉歷史</div>
    <div id="ltrades"></div>
  </div>
</div>
</div>
<script>
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}
function fmt(v){return(v>=0?'+':'')+v.toFixed(2)}
function gc(v){return v>=0?'g':'r'}
function showTab(t){$('paper-view').style.display=t==='paper'?'grid':'none';$('live-view').style.display=t==='live'?'grid':'none';document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.p===t)})}

/* TMPL 攔截清單擴充 */
var TMPL={ok:1,'-':1,'':1,'passed global risk gate':1,'no narrative match':1};
function isTmpl(r){return TMPL[String(r||'').trim().toLowerCase()]}

/* 英文 reason → 繁中顯示層翻譯（不動 state 原文） */
function zh(r){
  if(r==null)return'';
  var s=String(r);
  var R=[
    [/^dev sold \(paper override\)/,'開發者已賣出（模擬倉放行）'],
    [/^dev sold/,'開發者已賣出'],
    [/^honeypot/,'蜜罐幣'],
    [/^bundled/,'捆綁買入偵測'],
    [/^liq<\$?([0-9.]+)/,'流動性低於 $$1'],
    [/^mc band/,'市值超出區間'],
    [/^holders<([0-9.]+)/,'持有者少於 $1 人'],
    [/^top10 concentrated/,'前十大持倉過度集中'],
    [/^narrative L(\d+): (.*)$/,'命中 L$1 主題：「$2」'],
    [/^no narrative match: symbol\/name='(.*)' /,'無主題命中：symbol/name=\'$1\' '],
    [/^no narrative match$/,'無主題命中'],
    [/^insufficient gas for trade \(\$(.*)\)$/,'交易資金不足（可用 $1）'],
    [/^risk gate passed: (.*)$/,'風控通過：$1'],
    [/^passed global risk gate$/,'風控閘門通過'],
    [/^ok: /,'通過：'],
    [/^ok$/,'通過（無異常）'],
    [/^bad momentum 5m (.*%) red=(\d+)$/,'5 分鐘動能轉差 $1（紅 K $2 根）'],
    [/^strong pump (.*)$/,'強勢拉升 $1'],
    [/^up (.*)$/,'上行走勢 $1'],
    [/^flat (.*)$/,'橫盤整理 $1'],
    [/^weak (.*)$/,'動能偏弱 $1'],
    [/^insufficient kline$/,'K 線資料不足'],
    [/^seen recently$/,'48 小時內已拒絕過'],
    [/^seen before$/,'曾看過此代幣'],
    [/^lost on this before \((.*)\)$/,'此代幣上次交易虧損（$1）'],
    [/^symbol (.*) lost (\d+)x$/,'同名代幣 $1 已虧損 $2 次'],
    [/^fast dump (.*%) \(peak \+(.*)%\)$/,'急殺 $1（峰值 +$2%）'],
    [/^flow collapse s1=(\d+)\/b1=(\d+) s5=(\d+)\/b5=(\d+) (.*)$/,'買盤崩落：1m 賣$1/買$2、5m 賣$3/買$4，變化 $5'],
    [/^downtrend (.*%) (\d+)min$/,'下行趨勢 $1，已持倉 $2 分鐘'],
    [/^giveback \(peak \+(.*)%, now (.*)%\)$/,'獲利回吐（峰值 +$1%，現 $2%）'],
    [/^stale 12h (.*)$/,'閒置逾 12 小時 $1'],
    [/^no momentum 45min \((.*)\)$/,'45 分鐘無動能（$1）'],
    [/^disaster (.*)$/,'崩盤 $1'],
    [/^condition order filled$/,'條件單成交'],
    [/^swap timeout$/,'swap 逾時']
  ];
  for(var i=0;i<R.length;i++){if(R[i][0].test(s))return s.replace(R[i][0],R[i][1]);}
  return s
    .replace(/smart_wallets=/g,'聰明錢包數 ')
    .replace(/smart_buy_30m=/g,'30 分鐘聰明錢買入 ')
    .replace(/\bliq=\$/,'流動性 $')
    .replace(/\bmc=\$/,'市值 $')
    .replace(/\bequity=\$/,'權益 $')
    .replace(/\bcash=\$/,'現金 $')
    .replace(/\bopen=(\d+)\/(\d+)/,'持倉 $1/$2')
    .replace(/\bholders=/g,'持有者 ')
    .replace(/\bscore=/g,'評分 ');
}

function kpiH(arr){return arr.map(function(i){return'<div class="kpi"><div class="l">'+i[0]+'</div><div class="v '+(i[2]||'')+'">'+i[1]+'</div></div>'}).join('')}

/* 5-Agent 決策快照矩陣 */
function discH(log){
  if(!log||!log.length)return'';
  var g={},o=[];
  for(var i=0;i<log.length;i++){var a=log[i],t=a.token;if(!g[t]){g[t]=[];o.push(t)}g[t].push(a)}
  return o.map(function(tk){
    var items=g[tk],sc=0,ok=true;
    items.forEach(function(m){sc+=m.score;if(m.verdict==='veto')ok=false});
    var last=items[items.length-1],ts=new Date((last.ts||0)*1000);
    var tsS=isNaN(ts)?'':ts.getHours().toString().padStart(2,'0')+':'+ts.getMinutes().toString().padStart(2,'0');
    var nc={scanner:'sc',narrative:'na',risk:'ri',sniper:'sn',judge:'ju'};
    var agentSet={};items.forEach(function(m){agentSet[m.agent]=1});
    var agentsRan=Object.keys(agentSet).length;
    var short=agentsRan<5;
    var h='<div class="dcard" onclick="this.classList.toggle(\'open\')">';
    h+='<div class="dcard-h"><span class="dcard-sym">'+esc(tk)+'</span>';
    if(short){h+='<span class="pill partial">提早否決 '+agentsRan+'/5</span>'}
    h+='<span class="pill '+(ok?'ok':'no')+'">'+(ok?'通過':'否決')+'</span>';
    h+='<span class="dcard-sc" style="color:'+(ok?'var(--green)':'var(--red)')+'">'+sc+'</span>';
    h+='<span class="dcard-ts">'+tsS+'</span>';
    h+='<span class="dcard-arr">▸</span></div>';
    h+='<div class="dcard-b">';
    h+='<div class="snap-title">決策快照</div>';
    items.forEach(function(m){
      var tm=isTmpl(m.reason);
      h+='<div class="aline"><span class="a-nm '+(nc[m.agent]||'')+'">'+esc(m.agent)+'</span>';
      h+='<span class="a-sc">'+m.score+'</span>';
      h+='<span class="a-bd '+(m.verdict==='approve'?'ok':'no')+'">'+(m.verdict==='approve'?'OK':'NO')+'</span>';
      h+='<span class="a-rs'+(tm?' tmpl':'')+'">'+esc(zh(m.reason))+'</span></div>';
    });
    return h+'</div></div>';
  }).join('');
}

function tradesH(closed){
  if(!closed||!closed.length)return'<div style="color:var(--muted);padding:20px;text-align:center;font-size:12px">尚無交易紀錄</div>';
  return closed.slice().reverse().map(function(c){
    var pnl=parseFloat(c.pnl_usd)||0,pct=parseFloat(c.pnl_pct)||0;
    var ts=c.time,d=typeof ts==='string'?new Date(ts):new Date(ts>1e12?ts:ts*1000);
    var tsS=isNaN(d)?'':(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
    var reason=(c.exit_reason||c.reason||c.method||'-').substring(0,32);
    var isRt=isTmpl(reason);
    var uid='d'+Math.random().toString(36).substr(2,6);
    
    /* PEAK 高亮 */
    var peakHtml='';
    var peakVal=parseFloat(c.peak)||0;
    if(peakVal>0){peakHtml='<span class="peak-tag">PEAK +'+peakVal.toFixed(1)+'%</span>';}

    var h='<div class="trow" onclick="var d=document.getElementById(\''+uid+'\');this.classList.toggle(\'open\');d.style.display=d.style.display===\'block\'?\'none\':\'block\'">';
    h+='<div><div class="trow-s">'+esc(c.symbol)+peakHtml+'</div><div class="trow-sub">'+tsS+' · <span class="'+(isRt?'reason-tmpl':'')+'">'+esc(zh(reason))+'</span></div></div>';
    h+='<span class="trow-pct '+gc(pnl)+'">'+(pct>=0?'+':'')+pct.toFixed(1)+'%</span>';
    h+='<span class="trow-pnl '+gc(pnl)+'">'+fmt(pnl)+'</span></div>';
    h+='<div class="trow-d" id="'+uid+'">';
    var alloc=c.alloc_usd||5;
    h+=kv('倉位','$'+(+alloc).toFixed(2));
    if(c.entry_price) h+=kv('進場',c.entry_price.toPrecision(4));
    if(c.entry_eth) h+=kv('進場',c.entry_eth.toFixed(5)+' ETH');
    if(c.exit_price) h+=kv('出場',c.exit_price.toPrecision(4));
    if(c.exit_eth) h+=kv('出場',c.exit_eth.toFixed(5)+' ETH');
    h+=kv('滑價',(c.slip_pct||0).toFixed(2)+'%');
    h+=kv('燃料費','$'+(c.gas_usd||0).toFixed(3));
    h+=kv('方式',esc(c.method||'-'));
    
    var detailReason=(c.exit_reason||c.reason||'-');
    var isDetailTmpl=isTmpl(detailReason);
    h+=kv('理由','<span class="'+(isDetailTmpl?'reason-tmpl':'')+'">'+esc(zh(detailReason))+'</span>');

    if(c.held_min)h+=kv('持倉時間',c.held_min+' 分鐘');
    h+=snapMatrix(c);
    h+=meetingWarn(c);
    return h+'</div>';
  }).join('');
}

/* 交易明細內的 5-Agent 決策快照矩陣 */
function snapMatrix(c){
  var mt=c.meeting;
  if(!mt||!mt.length)return'';
  var nc={scanner:'sc',narrative:'na',risk:'ri',sniper:'sn',judge:'ju'};
  var h='<div class="snap-matrix"><div class="snap-t">決策快照</div>';
  mt.forEach(function(m){
    var tm=isTmpl(m.reason);
    h+='<div class="aline"><span class="a-nm '+(nc[m.agent]||'')+'">'+esc(m.agent)+'</span>';
    h+='<span class="a-sc">'+(m.score!=null?m.score:'-')+'</span>';
    h+='<span class="a-bd '+(m.verdict==='approve'?'ok':'no')+'">'+(m.verdict==='approve'?'OK':'NO')+'</span>';
    h+='<span class="a-rs'+(tm?' tmpl':'')+'">'+esc(m.reason)+'</span></div>';
  });
  return h+'</div>';
}

function meetingWarn(c){
  if(!c.meeting||!c.meeting.length)return'<div class="warn">歷史無留痕快照 · 策略早期紀錄</div>';
  var bad=c.meeting.filter(function(m){return isTmpl(m.reason)}).length;
  if(bad===c.meeting.length)return'<div class="warn">快照理由均為預設模板</div>';
  if(bad)return'<div class="warn">'+bad+' 項理由為模板</div>';
  return'';
}

function kv(k,v){return'<div class="kv"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}

async function poll(){
  try{
    var r=await fetch('/api/state?t='+Date.now());
    if(r.ok){var s=await r.json();var cl=s.closed||[];
    var real=cl.reduce(function(a,c){return a+(c.pnl_usd||0)},0);
    var tg=cl.reduce(function(a,c){return a+(c.gas_usd||0)},0);
    var w=cl.filter(function(c){return c.pnl_usd>0}).length;
    $('pkpi').innerHTML=kpiH([['現金','$'+s.cash_usd.toFixed(2),''],['已實現',fmt(real),gc(real)],['勝率',cl.length?Math.round(w/cl.length*100)+'%':'0%',''],['燃料費','$'+tg.toFixed(2),''],['持倉中',String(Object.keys(s.positions||{}).length),''],['已平倉',String(cl.length),'']]);
    $('pdisc').innerHTML=discH(s.agent_log||[]);
    $('ptrades').innerHTML=tradesH(cl);
    setOnline(true);}
  }catch(e){setOnline(false)}
  try{
    var r=await fetch('/api/live?t='+Date.now());
    if(r.ok){var l=await r.json();var lc=l.closed||[];
    var lr=lc.reduce(function(a,c){return a+(parseFloat(c.pnl_usd)||0)},0);
    var lg=lc.reduce(function(a,c){return a+(parseFloat(c.gas_usd)||0)},0);
    $('lkpi').innerHTML=kpiH([['鏈上餘額','$'+(l._onchain_usd||l.equity_usd||0).toFixed(2),''],['帳面價值','$'+(l.equity_usd||0).toFixed(2),''],['已實現',fmt(lr),gc(lr)],['燃料費','$'+lg.toFixed(2),''],['已平倉',String(lc.length),''],['持倉中',String(Object.keys(l.positions||{}).length),'']]);
    $('ltrades').innerHTML=tradesH(lc);}
  }catch(e){}
  setTimeout(poll,5000);
}

/* 狀態連線點切換 */
function setOnline(ok){
  var dot=document.getElementById('live-dot');
  var tag=document.getElementById('live-tag');
  if(!dot||!tag)return;
  if(ok){dot.className='pulse-dot';tag.className='livetag';tag.textContent='LIVE';}
  else{dot.className='pulse-dot offline';tag.className='livetag offline';tag.textContent='OFFLINE';}
}
poll();
</script>
